name: nginx-webcontrol
services:
  nginx:
    image: ${NGINX_UI_IMAGE:-uozi/nginx-ui:v2.6.3}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
      - "${UI_BIND:-0.0.0.0}:${UI_PORT:-9090}:9000"
    environment:
      TZ: ${TZ:-Etc/UTC}
      NGINX_UI_PRESERVE_BUNDLED_CONF: "true"
      NGINX_UI_IGNORE_DOCKER_SOCKET: "true"
    volumes:
      - ./data/nginx:/etc/nginx
      - ./data/certs-terminal:/etc/letsencrypt:ro
      - ./data/nginx-ui:/etc/nginx-ui
      - ./data/certs:/etc/nginx/certs:ro
      - ./data/www:/var/www
      - nginx_logs:/var/log/nginx
    networks: [proxy]
    depends_on:
      authelia:
        condition: service_healthy
      demo:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "nginx -t && curl -fsS http://127.0.0.1:9000/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
  wedding-invite:
    build:
      context: ./docker/wedding-invite
      # Application source checkout; set WEDDING_INVITE_SRC in .env.
      additional_contexts:
        app: ${WEDDING_INVITE_SRC:-./wedding-invitation}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [proxy]
  authelia:
    image: ${AUTHELIA_IMAGE:-authelia/authelia:4.39.28}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/jwt
    secrets: [session, storage, jwt]
    volumes:
      - ./data/authelia:/config
    networks: [proxy]
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    restart: unless-stopped
    # Persist Authelia sessions across restarts; not published outside the proxy network.
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    volumes:
      - redis_data:/data
    networks: [proxy]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  demo:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped
    networks: [proxy]
networks:
  proxy:
volumes:
  nginx_logs:
  redis_data:
secrets:
  session:
    file: ./secrets/session
  storage:
    file: ./secrets/storage
  jwt:
    file: ./secrets/jwt
