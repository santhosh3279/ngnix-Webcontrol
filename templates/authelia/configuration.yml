server:
  address: tcp://:9091/
log:
  level: info
totp:
  issuer: __DOMAIN__
authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    - domain: secure.__DOMAIN__
      policy: two_factor
session:
  name: authelia_session
  same_site: lax
  inactivity: 1y
  expiration: 1y
  remember_me: 1y
  # Sessions live in the compose `redis` service so restarts don't log users out.
  redis:
    host: redis
    port: 6379
  cookies:
    - domain: __DOMAIN__
      authelia_url: https://auth.__DOMAIN__
      default_redirection_url: https://secure.__DOMAIN__
regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m
storage:
  local:
    path: /config/db.sqlite3
# Local bootstrap delivery. Replace with SMTP before production use.
notifier:
  filesystem:
    filename: /config/notification.txt
