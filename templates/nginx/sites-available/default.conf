server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
# Management listener published through the Compose UI_BIND and UI_PORT settings.
server {
    listen 8080;
    server_name _;
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:9000;
    }
}
server {
    listen 80;
    server_name auth.__DOMAIN__ secure.__DOMAIN__ public.__DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www; }
    location / { return 301 https://$host$request_uri; }
}
